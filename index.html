Мысалы:

"Ол саған нақты не деп жазды?
Хабарламасын жіберсең,
соған байланысты нақты жауап ұсынамын."

Егер бірнеше жақсы нұсқа болса,
бірнеше нұсқа бер.

Мысалы:

1. Қысқа және табиғи
2. Әзілмен
3. Сенімді
4. Жылы
5. Еркін стильде

Қолданушыға қажетсіз ұзақ жауап берме.

Бірақ толық түсіндіру сұралса,
толық жауап бер.

Жауапты табиғи адам сияқты жаз.

Робот сияқты қайталанатын сөйлемдерді қолданба.

Қолданушының нақты сұрағына жауап бер.

Қажетсіз тақырыптарды өзіңнен қоспа.

`;


/* =========================================================
   LANGUAGE DETECTION
   ========================================================= */

function detectLanguage(text) {

    const value =
        text.toLowerCase();


    if (
        /[әіңғүұқөһ]/i
        .test(text)
    ) {

        return "kk";

    }


    if (
        /[ыэъё]/i
        .test(text)
    ) {

        return "ru";

    }


    if (
        /\b(the|what|how|why|hello|please|can|could)\b/i
        .test(value)
    ) {

        return "en";

    }


    return "kk";

}


/* =========================================================
   TOPIC DETECTION
   ========================================================= */

function detectTopic(text) {

    const t =
        text.toLowerCase();


    if (

        t.includes("қыз") ||

        t.includes("қызбен") ||

        t.includes("не жазам") ||

        t.includes("не деп жаз") ||

        t.includes("жауап бер") ||

        t.includes("әңгіме бастау") ||

        t.includes("девушка") ||

        t.includes("девушкой")

    ) {

        return "relationship";

    }


    if (

        t.includes("html") ||

        t.includes("css") ||

        t.includes("javascript") ||

        t.includes("react") ||

        t.includes("python") ||

        t.includes("код") ||

        t.includes("программ")

    ) {

        return "programming";

    }


    if (

        t.includes("оқу") ||

        t.includes("сабақ") ||

        t.includes("университет") ||

        t.includes("емтихан") ||

        t.includes("тапсырма")

    ) {

        return "education";

    }


    if (

        t.includes("сайт") ||

        t.includes("қосымша") ||

        t.includes("жоба") ||

        t.includes("идея")

    ) {

        return "project";

    }


    if (

        t.includes("кеңес") ||

        t.includes("не істеу") ||

        t.includes("маған көмектес")

    ) {

        return "advice";

    }


    return "general";

}


/* =========================================================
   CONTEXT UPDATE
   ========================================================= */

function updateContext(text) {

    conversationContext.language =
        detectLanguage(text);


    conversationContext.topic =
        detectTopic(text);


    conversationContext.lastQuestion =
        text;


    conversationContext.messagesCount++;

}


/* =========================================================
   FOLLOW-UP DETECTION
   ========================================================= */

function isFollowUpQuestion(text) {

    const lower =
        text
        .toLowerCase()
        .trim();


    const followUps = [

        "ал",

        "онда",

        "сосын",

        "кейін",

        "тағы",

        "ол ше",

        "ал ол ше",

        "енді",

        "қалай",

        "неге",

        "сонда",

        "содан кейін",

        "не істеймін",

        "не десем",

        "қалай жауап берем"

    ];


    return followUps.some(
        phrase =>
            lower.startsWith(
                phrase
            )
    );

}


/* =========================================================
   BUILD CONTEXT
   ========================================================= */

function buildContext(text) {

    updateContext(text);


    let contextText = `

Қолданушының қазіргі сұрағы:

${text}

Тіл:
${conversationContext.language}

Тақырып:
${conversationContext.topic}

Хабарламалар саны:
${conversationContext.messagesCount}

`;


    if (
        conversationContext.lastAnswer
    ) {

        contextText += `

Алдыңғы жауап:

${conversationContext.lastAnswer}

`;

    }


    if (
        isFollowUpQuestion(text)
    ) {

        contextText += `

МАҢЫЗДЫ:

Бұл сұрақ алдыңғы әңгіменің
жалғасы болуы мүмкін.

Сондықтан алдыңғы контекстті
міндетті түрде ескер.

`;

    }


    return contextText;

}


/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(
    text,
    type
) {


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " +
        type;


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "avatar";


    avatar.textContent =
        type === "ai"
            ? "AI"
            : "YOU";


    const body =
        document.createElement(
            "div"
        );


    body.className =
        "message-body";


    const textElement =
        document.createElement(
            "div"
        );


    textElement.className =
        "message-text";


    textElement.textContent =
        text;


    const meta =
        document.createElement(
            "div"
        );


    meta.className =
        "message-meta";


    meta.textContent =
        new Date()
            .toLocaleTimeString(
                "kk-KZ",
                {
                    hour:
                        "2-digit",

                    minute:
                        "2-digit"
                }
            );


    body.appendChild(
        textElement
    );


    body.appendChild(
        meta
    );


    message.appendChild(
        avatar
    );


    message.appendChild(
        body
    );


    messages.appendChild(
        message
    );


    scrollToBottom();

}


/* =========================================================
   SCROLL
   ========================================================= */

function scrollToBottom() {

    setTimeout(
        () => {

            chat.scrollTo({

                top:
                    chat.scrollHeight,

                behavior:
                    "smooth"

            });

        },

        50

    );

}


/* =========================================================
   TYPING STATE
   ========================================================= */

function setTyping(
    state
) {

    if (state) {

        typing.classList.add(
            "show"
        );

    } else {

        typing.classList.remove(
            "show"
        );

    }

}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage() {


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    if (
        !API_KEY ||
        API_KEY ===
        "YOUR_API_KEY_HERE"
    ) {

        addMessage(

            "API кілті енгізілмеген. Кодтағы YOUR_API_KEY_HERE орнына өзіңнің жаңа API кілтіңді енгіз.",

            "ai"

        );

        return;

    }


    welcome.classList.add(
        "hidden"
    );


    addMessage(
        text,
        "user"
    );


    input.value =
        "";


    input.style.height =
        "auto";


    sendButton.disabled =
        true;


    setTyping(
        true
    );


    const context =
        buildContext(
            text
        );


    const userPrompt = `

${context}

Осы сұраққа табиғи,
нақты және пайдалы жауап бер.

Егер сұрақ қызбен сөйлесуге
қатысты болса,
жағдайды ескеріп бірнеше
табиғи жауап нұсқасын ұсын.

Егер сұрақ түсініксіз болса,
нақтылау сұрағын қой.

Егер сұрақ алдыңғы хабарламаның
жалғасы болса,
алдыңғы контексті сақта.

`;


    try {


        const apiMessages = [

            {

                role:
                    "system",

                content:
                    SYSTEM_PROMPT

            },

            ...conversationHistory,

            {

                role:
                    "user",

                content:
                    userPrompt

            }

        ];


        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            API_KEY

                    },

                    body:
                        JSON.stringify({

                            model:
                                AI_MODEL,

                            messages:
                                apiMessages,

                            temperature:
                                0.8,

                            max_tokens:
                                1800

                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(

                data.error &&
                data.error.message

                    ?

                data.error.message

                    :

                "API серверінен жауап алынбады."

            );

        }


        const answer =
            data
                .choices[0]
                .message
                .content
                .trim();


        conversationHistory.push({

            role:
                "user",

            content:
                text

        });


        conversationHistory.push({

            role:
                "assistant",

            content:
                answer

        });


        conversationContext.lastAnswer =
            answer;


        if (
            conversationHistory.length
            >
            30
        ) {

            conversationHistory =
                conversationHistory
                    .slice(-30);

        }


        addMessage(
            answer,
            "ai"
        );


    } catch (
        error
    ) {


        console.error(
            "ARUZHAN AI ERROR:",
            error
        );


        addMessage(

            "Кешіріңіз, AI-мен байланысу кезінде қате пайда болды.\n\n" +
            error.message,

            "ai"

        );

    }


    setTyping(
        false
    );


    sendButton.disabled =
        false;


    input.focus();

}


/* =========================================================
   QUICK QUESTIONS
   ========================================================= */

document
    .querySelectorAll(
        ".quick-card"
    )
    .forEach(
        card => {

            card.addEventListener(
                "click",
                () => {

                    const question =
                        card.dataset.question;


                    input.value =
                        question;


                    input.dispatchEvent(
                        new Event(
                            "input"
                        )
                    );


                    sendMessage();

                }
            );

        }
    );


/* =========================================================
   SEND BUTTON
   ========================================================= */

sendButton.addEventListener(

    "click",

    sendMessage

);


/* =========================================================
   ENTER KEY
   ========================================================= */

input.addEventListener(

    "keydown",

    event => {


        if (

            event.key ===
                "Enter" &&

            !event.shiftKey

        ) {


            event.preventDefault();


            sendMessage();


        }

    }

);


/* =========================================================
   AUTO RESIZE
   ========================================================= */

input.addEventListener(

    "input",

    function() {


        this.style.height =
            "auto";


        this.style.height =
            Math.min(

                this.scrollHeight,

                180

            ) +
            "px";


    }

);


/* =========================================================
   CLEAR CHAT
   ========================================================= */

clearChat.addEventListener(

    "click",

    () => {


        conversationHistory =
            [];


        conversationContext = {

            topic:
                null,

            language:
                "kk",

            lastQuestion:
                null,

            lastAnswer:
                null,

            messagesCount:
                0

        };


        messages.innerHTML =
            "";


        welcome.classList.remove(
            "hidden"
        );


        input.value =
            "";


        input.style.height =
            "auto";


        input.focus();


    }

);


/* =========================================================
   INITIALIZATION
   ========================================================= */

window.addEventListener(

    "load",

    () => {

        input.focus();

    }

);


/* =========================================================
   END OF ARUZHAN AI
   ========================================================= */

</script>


</body>
</html>
