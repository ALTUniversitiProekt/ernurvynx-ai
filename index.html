<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARUZHAN AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#08080d;
    color:#fff;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:1100px;
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    height:70px;
    display:flex;
    align-items:center;
    padding:0 25px;
    border-bottom:1px solid #24242e;
    background:#0d0d13;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#8b5cf6,#ec4899);
    font-weight:bold;
}

.logo h1{
    font-size:16px;
}

.logo p{
    color:#777783;
    font-size:10px;
    margin-top:4px;
}

.status{
    margin-left:auto;
    color:#22c55e;
    font-size:11px;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:30px 20px 150px;
}

.welcome{
    max-width:650px;
    margin:80px auto;
    text-align:center;
}

.welcome-icon{
    width:70px;
    height:70px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:22px;
    background:linear-gradient(135deg,#8b5cf6,#ec4899);
    font-size:18px;
    font-weight:bold;
    box-shadow:0 20px 60px rgba(139,92,246,.25);
}

.welcome h2{
    margin-top:25px;
    font-size:32px;
}

.welcome p{
    margin-top:15px;
    color:#92929f;
    line-height:1.7;
    font-size:14px;
}

.messages{
    max-width:800px;
    margin:auto;
}

.message{
    display:flex;
    gap:12px;
    margin:25px 0;
    animation:show .3s ease;
}

.message.user{
    flex-direction:row-reverse;
}

.avatar{
    width:34px;
    height:34px;
    min-width:34px;
    border-radius:10px;
    background:#1b1b25;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:bold;
}

.message.ai .avatar{
    background:linear-gradient(135deg,#8b5cf6,#ec4899);
}

.content{
    max-width:75%;
}

.text{
    padding:14px 17px;
    background:#15151e;
    border:1px solid #24242e;
    border-radius:5px 16px 16px 16px;
    font-size:14px;
    line-height:1.7;
    white-space:pre-wrap;
}

.user .text{
    background:#33205a;
    border-radius:16px 5px 16px 16px;
}

.time{
    margin-top:5px;
    color:#555560;
    font-size:9px;
}

.typing{
    display:none;
    max-width:800px;
    margin:10px auto;
    color:#777783;
    font-size:11px;
}

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    padding:20px;
    background:linear-gradient(
        transparent,
        #08080d 30%
    );
}

.input-box{
    max-width:800px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:8px;
    background:#12121a;
    border:1px solid #292936;
    border-radius:17px;
}

textarea{
    flex:1;
    resize:none;
    max-height:180px;
    min-height:42px;
    padding:12px;
    border:none;
    outline:none;
    background:transparent;
    color:white;
    font-size:14px;
    font-family:Arial;
}

textarea::placeholder{
    color:#666672;
}

button{
    width:42px;
    height:42px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#8b5cf6,#ec4899);
    color:white;
    cursor:pointer;
    font-size:18px;
}

button:disabled{
    opacity:.4;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .chat{
        padding-left:12px;
        padding-right:12px;
    }

    .content{
        max-width:85%;
    }

    .welcome{
        margin:50px auto;
    }

    .welcome h2{
        font-size:25px;
    }

}

</style>
</head>

<body>

<div class="app">

<header>

    <div class="logo">

        <div class="logo-icon">
            AI
        </div>

        <div>
            <h1>ARUZHAN AI</h1>
            <p>Ақылды әңгіме көмекшісі</p>
        </div>

    </div>

    <div class="status">
        ● AI Online
    </div>

</header>


<main class="chat" id="chat">

    <div class="welcome" id="welcome">

        <div class="welcome-icon">
            AI
        </div>

        <h2>
            Сәлем! Мен ARUZHAN AI 🤍
        </h2>

        <p>
            Мен саған қызбен сөйлесуге,
            әңгіме бастауға, жауап ойлауға
            және кез келген қалыпты сұраққа
            жауап беруге көмектесемін.
        </p>

    </div>


    <div class="messages" id="messages"></div>

    <div class="typing" id="typing">
        ARUZHAN AI жауап дайындап жатыр...
    </div>

</main>


<div class="input-area">

    <div class="input-box">

        <textarea
            id="input"
            placeholder="ARUZHAN AI-ға хабарлама жаз..."
            rows="1">
        </textarea>

        <button
            id="send"
            onclick="sendMessage()">

            ➤

        </button>

    </div>

</div>

</div>


<script>

/*
=========================================================
 ARUZHAN AI
 REAL AI CHAT
=========================================================

 МАҢЫЗДЫ:

 API KEY-ді браузердегі HTML-ге қою қауіпсіз емес.

 Бұл код демонстрациялық прототип үшін.

 Production жоба үшін:
 index.html
 +
 server.js
 +
 .env

 қолданған дұрыс.

=========================================================
*/


/*
=========================================================
 API KEY
=========================================================

 ТӨМЕНГЕ ӨЗІҢНІҢ ЖАҢА API KEY КІЛТІҢДІ ЖАЗ.

 Мысалы:

 const API_KEY = "sk-proj-...";

=========================================================
*/

const API_KEY = "ӨЗІҢНІҢ_API_KEY_КІЛТІҢДІ_ОСЫ_ЖЕРГЕ_ЖАЗ";


/*
=========================================================
 OPENAI API URL
=========================================================
*/

const API_URL =
"https://api.openai.com/v1/chat/completions";


/*
=========================================================
 CHAT HISTORY
=========================================================
*/

let history = [];


/*
=========================================================
 ELEMENTS
=========================================================
*/

const input =
document.getElementById("input");

const send =
document.getElementById("send");

const messages =
document.getElementById("messages");

const chat =
document.getElementById("chat");

const typing =
document.getElementById("typing");

const welcome =
document.getElementById("welcome");


/*
=========================================================
 SYSTEM PROMPT
=========================================================
*/

const SYSTEM_PROMPT = `

Сенің атың ARUZHAN AI.

Сен — ақылды, табиғи және пайдалы
AI әңгіме көмекшісісің.

Сенің негізгі бағытың:

Қызбен сөйлесуге көмектесу.

Сен қолданушыға:

- не жазу керегін;
- әңгімені қалай бастау керегін;
- әңгімені қалай жалғастыру керегін;
- бірнеше жауап нұсқасын;
- хабарламаның мағынасын;
- мәтінді әдемі әрі табиғи етіп жазуды;
- қызықты сұрақтар;
- қарым-қатынас бойынша кеңестер

ұсына аласың.

Бірақ сен тек осы тақырыппен шектелмейсің.

Қолданушы кез келген қалыпты сұрақ қойса,
оған тікелей жауап бер.

Математика,
тарих,
технология,
бағдарламалау,
HTML,
CSS,
JavaScript,
оқу,
күнделікті өмір,
идеялар,
шығармашылық және басқа да
тақырыптарға жауап бере аласың.

Қолданушы қай тілде сөйлесе,
сол тілде жауап бер.

Қазақша → қазақша.

Орысша → орысша.

Ағылшынша → ағылшынша.

Жауаптарың табиғи болсын.

Қажетсіз қайталама.

Сұраққа нақты жауап бер.

Егер қолданушы толық түсіндіру сұраса,
толық түсіндір.

Егер қысқа жауап сұраса,
қысқа жауап бер.

Егер қызбен сөйлесуге қатысты
жағдай болса,
жағдайды талдап,
бірнеше табиғи нұсқа ұсын.

Сенің мақсатың —
қолданушыға өз ойын жақсы жеткізуге
және жақсы қарым-қатынас құруға көмектесу.

`;


/*
=========================================================
 SEND MESSAGE
=========================================================
*/

async function sendMessage(){

    const text =
    input.value.trim();


    if(!text){
        return;
    }


    if(
        !API_KEY ||
        API_KEY.includes(
            "ӨЗІҢНІҢ"
        )
    ){

        addMessage(
            "API кілтін кодқа енгізу керек.",
            "ai"
        );

        return;

    }


    welcome.style.display =
    "none";


    addMessage(
        text,
        "user"
    );


    input.value = "";

    input.style.height =
    "auto";


    send.disabled =
    true;

    typing.style.display =
    "block";


    try{


        const apiMessages = [

            {
                role:
                "system",

                content:
                SYSTEM_PROMPT
            },

            ...history,

            {
                role:
                "user",

                content:
                text
            }

        ];


        const response =
        await fetch(
            API_URL,
            {

                method:
                "POST",

                headers:{
                    "Content-Type":
                    "application/json",

                    "Authorization":
                    "Bearer " +
                    API_KEY
                },

                body:
                JSON.stringify({

                    model:
                    "gpt-4o-mini",

                    messages:
                    apiMessages,

                    temperature:
                    0.8,

                    max_tokens:
                    1500

                })

            }
        );


        const data =
        await response.json();


        if(!response.ok){

            throw new Error(
                data.error?.message ||
                "API Error"
            );

        }


        const answer =
        data
        .choices[0]
        .message
        .content;


        history.push({

            role:
            "user",

            content:
            text

        });


        history.push({

            role:
            "assistant",

            content:
            answer

        });


        /*
        Соңғы 20 хабарламаны
        ғана есте сақтау
        */

        if(
            history.length >
            20
        ){

            history =
            history.slice(
                -20
            );

        }


        addMessage(
            answer,
            "ai"
        );


    }catch(error){

        console.error(
            error
        );


        addMessage(

            "AI-мен байланысу кезінде қате болды.\n\n" +
            error.message,

            "ai"

        );

    }


    typing.style.display =
    "none";


    send.disabled =
    false;


    input.focus();

}


/*
=========================================================
 ADD MESSAGE
=========================================================
*/

function addMessage(
    text,
    type
){

    const message =
    document.createElement(
        "div"
    );


    message.className =
    "message " +
    type;


    const avatar =
    document.createElement(
        "div"
    );


    avatar.className =
    "avatar";


    avatar.textContent =
    type === "ai"
    ? "AI"
    : "YOU";


    const content =
    document.createElement(
        "div"
    );


    content.className =
    "content";


    const textElement =
    document.createElement(
        "div"
    );


    textElement.className =
    "text";


    textElement.textContent =
    text;


    const time =
    document.createElement(
        "div"
    );


    time.className =
    "time";


    time.textContent =
    new Date()
    .toLocaleTimeString(
        "kk-KZ",
        {
            hour:
            "2-digit",

            minute:
            "2-digit"
        }
    );


    content.appendChild(
        textElement
    );


    content.appendChild(
        time
    );


    message.appendChild(
        avatar
    );


    message.appendChild(
        content
    );


    messages.appendChild(
        message
    );


    chat.scrollTo({

        top:
        chat.scrollHeight,

        behavior:
        "smooth"

    });

}


/*
=========================================================
 ENTER
=========================================================
*/

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/*
=========================================================
 AUTO RESIZE
=========================================================
*/

input.addEventListener(
    "input",
    function(){

        this.style.height =
        "auto";

        this.style.height =
        Math.min(
            this.scrollHeight,
            180
        ) +
        "px";

    }
);

</script>

</body>
</html>
