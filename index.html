<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08080d">
<title>ARUZHAN AI</title>

<style>
/* =========================================================
   ARUZHAN AI — SINGLE FILE AI ASSISTANT
   HTML + CSS + JAVASCRIPT
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#07070b;
    --panel:#0d0d14;
    --panel2:#12121b;
    --panel3:#181824;
    --border:rgba(255,255,255,.08);
    --text:#f5f5f7;
    --muted:#92929f;
    --purple:#8b5cf6;
    --purple2:#6d28d9;
    --blue:#3b82f6;
    --green:#22c55e;
    --red:#ef4444;
    --gradient:linear-gradient(135deg,#8b5cf6,#6366f1,#3b82f6);
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

/* =========================================================
   APP
   ========================================================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    overflow:hidden;
    position:relative;
    background:
    radial-gradient(circle at 20% 0%,rgba(99,102,241,.1),transparent 30%),
    radial-gradient(circle at 100% 100%,rgba(139,92,246,.08),transparent 30%),
    var(--bg);
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{
    width:280px;
    height:100vh;
    flex-shrink:0;
    padding:22px 16px;
    display:flex;
    flex-direction:column;
    background:rgba(10,10,16,.96);
    border-right:1px solid var(--border);
    z-index:100;
    transition:.3s ease;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    padding:4px 8px 25px;
}

.logo-icon{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:var(--gradient);
    font-size:12px;
    font-weight:900;
    box-shadow:0 10px 30px rgba(99,102,241,.3);
}

.logo-text h1{
    font-size:15px;
    letter-spacing:.5px;
}

.logo-text span{
    color:var(--muted);
    font-size:10px;
}

.new-chat{
    width:100%;
    height:46px;
    border:1px solid rgba(139,92,246,.3);
    border-radius:12px;
    background:rgba(139,92,246,.08);
    color:white;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    margin-bottom:25px;
    transition:.25s;
}

.new-chat:hover{
    background:rgba(139,92,246,.18);
    transform:translateY(-1px);
}

.section-title{
    color:#666674;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    padding:0 10px 10px;
}

.modes{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.mode{
    width:100%;
    padding:11px 10px;
    border:1px solid transparent;
    border-radius:12px;
    background:transparent;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    cursor:pointer;
    transition:.25s;
}

.mode:hover{
    background:rgba(255,255,255,.04);
    color:white;
}

.mode.active{
    background:rgba(139,92,246,.13);
    border-color:rgba(139,92,246,.2);
    color:white;
}

.mode-icon{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:rgba(255,255,255,.05);
}

.mode-info{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.mode-info strong{
    font-size:12px;
}

.mode-info small{
    color:#666674;
    font-size:10px;
}

.sidebar-bottom{
    margin-top:auto;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    padding:11px;
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--muted);
    font-size:11px;
    margin-bottom:15px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px rgba(34,197,94,.8);
}

.sidebar-footer{
    border-top:1px solid var(--border);
    padding-top:13px;
    display:flex;
    justify-content:space-between;
    color:#555560;
    font-size:10px;
}

/* =========================================================
   MAIN
   ========================================================= */

.main{
    flex:1;
    min-width:0;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    height:72px;
    flex-shrink:0;
    padding:0 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
    background:rgba(7,7,11,.8);
    backdrop-filter:blur(20px);
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.mobile-menu{
    display:none;
    width:38px;
    height:38px;
    border:1px solid var(--border);
    border-radius:10px;
    background:transparent;
    color:white;
    cursor:pointer;
}

.ai-avatar{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    background:var(--gradient);
    font-size:10px;
    font-weight:900;
}

.header-info h2{
    font-size:14px;
}

.online{
    margin-top:3px;
    display:flex;
    align-items:center;
    gap:5px;
    color:#777783;
    font-size:10px;
}

.online i{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--green);
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.current-mode{
    padding:7px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--muted);
    font-size:11px;
}

.clear-btn{
    width:38px;
    height:38px;
    border:1px solid transparent;
    border-radius:10px;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    font-size:16px;
}

.clear-btn:hover{
    background:rgba(255,255,255,.05);
    border-color:var(--border);
    color:white;
}

/* =========================================================
   CHAT
   ========================================================= */

.chat{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:35px max(20px,calc((100vw - 1050px)/2)) 160px;
}

.chat::-webkit-scrollbar{
    width:7px;
}

.chat::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.1);
    border-radius:20px;
}

/* =========================================================
   WELCOME
   ========================================================= */

.welcome{
    max-width:850px;
    margin:60px auto 45px;
    text-align:center;
    animation:fadeUp .5s ease;
}

.welcome-logo{
    width:70px;
    height:70px;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:22px;
    background:var(--gradient);
    font-weight:900;
    font-size:17px;
    box-shadow:0 15px 45px rgba(99,102,241,.25);
}

.welcome h1{
    font-size:32px;
    margin-bottom:10px;
}

.welcome p{
    color:var(--muted);
    font-size:14px;
}

.quick-actions{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.quick{
    padding:15px;
    text-align:left;
    border:1px solid var(--border);
    border-radius:14px;
    background:rgba(255,255,255,.025);
    color:var(--text);
    cursor:pointer;
    transition:.25s;
}

.quick:hover{
    background:rgba(139,92,246,.08);
    border-color:rgba(139,92,246,.3);
    transform:translateY(-2px);
}

.quick strong{
    display:block;
    font-size:12px;
    margin-bottom:5px;
}

.quick span{
    color:var(--muted);
    font-size:10px;
}

/* =========================================================
   MESSAGE
   ========================================================= */

.message{
    max-width:850px;
    margin:0 auto 25px;
    display:flex;
    gap:12px;
    animation:messageIn .3s ease;
}

.message.user{
    flex-direction:row-reverse;
}

.avatar{
    width:34px;
    height:34px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    font-size:9px;
    font-weight:900;
}

.message.ai .avatar{
    background:var(--gradient);
}

.message.user .avatar{
    background:rgba(255,255,255,.08);
    border:1px solid var(--border);
}

.message-body{
    max-width:calc(100% - 50px);
}

.message-text{
    font-size:14px;
    line-height:1.75;
    overflow-wrap:anywhere;
}

.message.user .message-text{
    background:rgba(139,92,246,.12);
    border:1px solid rgba(139,92,246,.16);
    border-radius:5px 16px 16px 16px;
    padding:10px 15px;
}

.message.user .message-body{
    text-align:right;
}

.message-time{
    margin-top:5px;
    color:#555560;
    font-size:9px;
}

/* =========================================================
   CODE
   ========================================================= */

.code-block{
    margin:14px 0;
    padding:16px;
    background:#050508;
    border:1px solid var(--border);
    border-radius:12px;
    overflow-x:auto;
    color:#ddd;
    font-family:Consolas,monospace;
    font-size:12px;
    line-height:1.7;
    text-align:left;
}

.inline-code{
    background:rgba(255,255,255,.08);
    color:#a78bfa;
    padding:2px 6px;
    border-radius:5px;
    font-family:Consolas,monospace;
}

/* =========================================================
   TYPING
   ========================================================= */

.typing{
    max-width:850px;
    margin:0 auto 20px;
    display:none;
    align-items:center;
    gap:10px;
}

.typing.show{
    display:flex;
}

.typing-avatar{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:var(--gradient);
    font-size:9px;
    font-weight:900;
}

.dots{
    display:flex;
    gap:4px;
}

.dots span{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#a78bfa;
    animation:bounce 1s infinite;
}

.dots span:nth-child(2){
    animation-delay:.15s;
}

.dots span:nth-child(3){
    animation-delay:.3s;
}

/* =========================================================
   INPUT
   ========================================================= */

.input-area{
    position:relative;
    padding:15px max(20px,calc((100vw - 1050px)/2)) 20px;
    background:linear-gradient(to top,var(--bg) 70%,transparent);
}

.input-box{
    max-width:850px;
    min-height:58px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:8px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:17px;
    background:rgba(18,18,27,.96);
    transition:.25s;
}

.input-box:focus-within{
    border-color:rgba(139,92,246,.5);
    box-shadow:0 0 0 3px rgba(139,92,246,.06);
}

textarea{
    flex:1;
    min-width:0;
    min-height:40px;
    max-height:180px;
    resize:none;
    border:none;
    outline:none;
    background:transparent;
    color:white;
    padding:10px 5px;
    font-size:14px;
    line-height:20px;
}

textarea::placeholder{
    color:#5f5f6b;
}

.send{
    width:42px;
    height:42px;
    border:none;
    border-radius:11px;
    background:var(--gradient);
    color:white;
    cursor:pointer;
    font-size:17px;
    transition:.25s;
}

.send:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(99,102,241,.35);
}

.send:disabled{
    opacity:.4;
    cursor:not-allowed;
    transform:none;
}

.hint{
    text-align:center;
    margin-top:8px;
    color:#454550;
    font-size:9px;
}

/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
        opacity:.4;
    }
    50%{
        transform:translateY(-5px);
        opacity:1;
    }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:768px){

    .sidebar{
        position:fixed;
        left:0;
        top:0;
        transform:translateX(-100%);
        box-shadow:20px 0 60px rgba(0,0,0,.5);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .mobile-menu{
        display:block;
    }

    .header{
        height:64px;
        padding:0 14px;
    }

    .current-mode{
        display:none;
    }

    .chat{
        padding:25px 12px 140px;
    }

    .welcome{
        margin:40px auto;
    }

    .welcome h1{
        font-size:25px;
    }

    .quick-actions{
        grid-template-columns:1fr;
    }

    .message-text{
        font-size:13px;
    }

    .input-area{
        padding:10px 10px 14px;
    }

    .hint{
        display:none;
    }
}

@media(max-width:450px){

    .logo-text h1{
        font-size:14px;
    }

    .header-info h2{
        font-size:12px;
    }

    .welcome-logo{
        width:60px;
        height:60px;
    }

    .welcome h1{
        font-size:23px;
    }

    .message{
        gap:8px;
    }

    .avatar{
        width:30px;
        height:30px;
    }

    .message-text{
        font-size:12.5px;
    }

}
</style>
</head>


<body>

<div class="app">

<!-- ======================================================
     SIDEBAR
======================================================= -->

<aside class="sidebar" id="sidebar">

    <div class="logo">
        <div class="logo-icon">AI</div>

        <div class="logo-text">
            <h1>ARUZHAN AI</h1>
            <span>Intelligent Assistant</span>
        </div>
    </div>

    <button class="new-chat" onclick="newChat()">
        ＋ Жаңа чат
    </button>

    <div class="section-title">
        AI MODE
    </div>

    <div class="modes">

        <button class="mode active" onclick="setMode('companion',this)">
            <div class="mode-icon">🤍</div>
            <div class="mode-info">
                <strong>Companion</strong>
                <small>Natural conversation</small>
            </div>
        </button>

        <button class="mode" onclick="setMode('smart',this)">
            <div class="mode-icon">🧠</div>
            <div class="mode-info">
                <strong>Smart AI</strong>
                <small>Universal assistant</small>
            </div>
        </button>

        <button class="mode" onclick="setMode('study',this)">
            <div class="mode-icon">📚</div>
            <div class="mode-info">
                <strong>Study</strong>
                <small>Learn and understand</small>
            </div>
        </button>

        <button class="mode" onclick="setMode('developer',this)">
            <div class="mode-icon">💻</div>
            <div class="mode-info">
                <strong>Developer</strong>
                <small>Code and technology</small>
            </div>
        </button>

        <button class="mode" onclick="setMode('motivation',this)">
            <div class="mode-icon">🚀</div>
            <div class="mode-info">
                <strong>Motivation</strong>
                <small>Goals and productivity</small>
            </div>
        </button>

    </div>

    <div class="sidebar-bottom">

        <div class="status">
            <span class="status-dot"></span>
            <span>AI Ready</span>
        </div>

        <div class="sidebar-footer">
            <span>ARUZHAN AI</span>
            <span>v1.0</span>
        </div>

    </div>

</aside>


<!-- ======================================================
     MAIN
======================================================= -->

<main class="main">

<header class="header">

    <div class="header-left">

        <button
            class="mobile-menu"
            onclick="toggleSidebar()">
            ☰
        </button>

        <div class="ai-avatar">
            AI
        </div>

        <div class="header-info">
            <h2>ARUZHAN AI</h2>

            <div class="online">
                <i></i>
                Online
            </div>
        </div>

    </div>

    <div class="header-right">

        <div class="current-mode" id="modeLabel">
            Companion
        </div>

        <button
            class="clear-btn"
            onclick="clearChat()">
            🗑
        </button>

    </div>

</header>


<!-- ======================================================
     CHAT
======================================================= -->

<div class="chat" id="chat">

    <div class="welcome" id="welcome">

        <div class="welcome-logo">
            AI
        </div>

        <h1>Сәлем! Мен ARUZHAN AI</h1>

        <p>
            Сұрағыңды жаз. Мен саған мүмкіндігінше көмектесуге тырысамын.
        </p>

        <div class="quick-actions">

            <button class="quick"
                onclick="quickAsk('Маған HTML үйретші')">
                <strong>💻 Код жазу</strong>
                <span>HTML, CSS, JavaScript және бағдарламалау</span>
            </button>

            <button class="quick"
                onclick="quickAsk('Маған сабақ оқуға көмектесші')">
                <strong>📚 Оқу</strong>
                <span>Күрделі тақырыптарды түсіндіріп беру</span>
            </button>

            <button class="quick"
                onclick="quickAsk('Маған бүгінгі күнге жоспар құрып берші')">
                <strong>🚀 Жоспар</strong>
                <span>Күнделікті мақсаттар мен жоспарлау</span>
            </button>

            <button class="quick"
                onclick="quickAsk('Маған қызықты бір нәрсе айтып берші')">
                <strong>🧠 Білім</strong>
                <span>Қызықты ақпарат және сұрақтарға жауап</span>
            </button>

        </div>

    </div>


    <div id="messages"></div>


    <div class="typing" id="typing">

        <div class="typing-avatar">
            AI
        </div>

        <div>
            ARUZHAN AI ойлануда
        </div>

        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

</div>


<!-- ======================================================
     INPUT
======================================================= -->

<div class="input-area">

    <div class="input-box">

        <textarea
            id="input"
            rows="1"
            placeholder="ARUZHAN AI-ға сұрағыңды жаз..."
            onkeydown="handleKey(event)"
            oninput="resizeInput(this)">
        </textarea>

        <button
            class="send"
            id="send"
            onclick="sendMessage()">
            ➤
        </button>

    </div>

    <div class="hint">
        Enter — жіберу · Shift + Enter — жаңа жол
    </div>

</div>

</main>

</div>


<script>

/* =========================================================
   ARUZHAN AI — JAVASCRIPT ENGINE
   ========================================================= */

let currentMode = "companion";

let messages = [];

let isThinking = false;


/* =========================================================
   ELEMENTS
   ========================================================= */

const input =
    document.getElementById("input");

const messagesBox =
    document.getElementById("messages");

const typing =
    document.getElementById("typing");

const welcome =
    document.getElementById("welcome");

const sendButton =
    document.getElementById("send");


/* =========================================================
   MODE
   ========================================================= */

function setMode(mode,button){

    currentMode = mode;

    document
        .querySelectorAll(".mode")
        .forEach(item =>
            item.classList.remove("active")
        );

    button.classList.add("active");

    const names = {
        companion:"Companion",
        smart:"Smart AI",
        study:"Study",
        developer:"Developer",
        motivation:"Motivation"
    };

    document.getElementById("modeLabel")
        .textContent =
        names[mode];

}


/* =========================================================
   SEND
   ========================================================= */

function sendMessage(){

    if(isThinking) return;

    const text =
        input.value.trim();

    if(!text) return;

    addMessage(
        text,
        "user"
    );

    input.value = "";

    resizeInput(input);

    showThinking();

    setTimeout(() => {

        const answer =
            generateAIResponse(text);

        hideThinking();

        addMessage(
            answer,
            "ai"
        );

    },700);

}


/* =========================================================
   QUICK QUESTION
   ========================================================= */

function quickAsk(text){

    input.value = text;

    sendMessage();

}


/* =========================================================
   KEYBOARD
   ========================================================= */

function handleKey(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}


/* =========================================================
   RESIZE INPUT
   ========================================================= */

function resizeInput(element){

    element.style.height = "auto";

    element.style.height =
        Math.min(
            element.scrollHeight,
            180
        ) + "px";

}


/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(text,type){

    welcome.style.display = "none";

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " + type;

    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        type === "ai"
        ? "AI"
        : "YOU";

    const body =
        document.createElement("div");

    body.className =
        "message-body";

    const content =
        document.createElement("div");

    content.className =
        "message-text";

    if(type === "ai"){

        content.innerHTML =
            formatResponse(text);

    }else{

        content.textContent =
            text;

    }

    const time =
        document.createElement("div");

    time.className =
        "message-time";

    time.textContent =
        new Date()
        .toLocaleTimeString(
            "kk-KZ",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    body.appendChild(content);

    body.appendChild(time);

    wrapper.appendChild(avatar);

    wrapper.appendChild(body);

    messagesBox.appendChild(wrapper);

    messagesBox.scrollIntoView({
        behavior:"smooth",
        block:"end"
    });

    const chat =
        document.getElementById("chat");

    chat.scrollTo({
        top:chat.scrollHeight,
        behavior:"smooth"
    });

}


/* =========================================================
   FORMAT RESPONSE
   ========================================================= */

function formatResponse(text){

    let result =
        escapeHTML(text);

    result =
        result.replace(
            /```([\s\S]*?)```/g,
            '<pre class="code-block">$1</pre>'
        );

    result =
        result.replace(
            /`([^`]+)`/g,
            '<span class="inline-code">$1</span>'
        );

    result =
        result.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

    result =
        result.replace(
            /\n/g,
            "<br>"
        );

    return result;

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================================================
   THINKING
   ========================================================= */

function showThinking(){

    isThinking = true;

    typing.classList.add("show");

    sendButton.disabled = true;

    const chat =
        document.getElementById("chat");

    setTimeout(() => {

        chat.scrollTo({
            top:chat.scrollHeight,
            behavior:"smooth"
        });

    },50);

}


function hideThinking(){

    isThinking = false;

    typing.classList.remove("show");

    sendButton.disabled = false;

}
